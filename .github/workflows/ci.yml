name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vectors-manifest:
    name: Vector copy matches manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SHA-256 of every vector file
        working-directory: vectors/spec-2.0
        run: |
          python3 - <<'PY'
          import hashlib, json
          manifest = json.load(open("manifest.json"))
          for name, entry in manifest["files"].items():
              digest = hashlib.sha256(open(name, "rb").read()).hexdigest()
              assert digest == entry["sha256"], f"{name} differs from manifest"
          print("ok", len(manifest["files"]), "files")
          PY

  core:
    name: Rust core (fmt, clippy, tests)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check formatting
        working-directory: core
        run: cargo fmt --check

      - name: Run clippy with warnings as errors
        working-directory: core
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests against spec 2.0 vectors
        working-directory: core
        run: cargo test --all-targets --locked

  wasm:
    name: WebAssembly binding (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0 with the wasm target
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm

      - name: Install wasm-bindgen CLI matching the crate pin
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Rust formatting and clippy
        working-directory: bindings/wasm
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Build the package
        working-directory: bindings/wasm
        run: npm run build

      - name: Run tests against spec 2.0 vectors
        working-directory: bindings/wasm
        run: npm test

      - name: Check npm package stays under 200 KB
        working-directory: bindings/wasm
        run: |
          SIZE=$(npm pack --dry-run --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].size))")
          echo "npm package size: ${SIZE} bytes"
          test "${SIZE}" -lt 200000
