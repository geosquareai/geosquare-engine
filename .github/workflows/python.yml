name: Python binding

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python binding (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/python

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Rust formatting and clippy
        working-directory: bindings/python
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Build and install the binding with test extras
        run: python -m pip install "./bindings/python[test]"

      - name: Run tests against spec 2.0 vectors
        run: python -m pytest -q bindings/python/tests
