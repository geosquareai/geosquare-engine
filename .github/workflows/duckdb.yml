name: DuckDB extension

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    name: Build once, test on DuckDB ${{ matrix.duckdb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        duckdb: ["1.4.0", "1.4.5", "1.5.0", "1.5.6", "2.0.0"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/duckdb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and clippy
        working-directory: bindings/duckdb
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests and build
        working-directory: bindings/duckdb
        run: |
          cargo test --release --locked
          ./build.sh

      - name: Vector and dataset tests
        working-directory: bindings/duckdb
        env:
          DUCKDB_VERSIONS: ${{ matrix.duckdb }}
          TESTS: tests/test_vectors.py tests/test_datasets.py tests/test_iceberg_planned.py tests/test_fill_nulls.py tests/test_docs_examples.py tests/test_multi_db.py tests/test_detect.py
        run: tests/run_versions.sh

      - name: S3 writes against an emulator
        working-directory: bindings/duckdb
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          S3_TEST_ENDPOINT: 127.0.0.1:5555
          S3_TEST_BUCKET: geo-test
        run: |
          python -m pip install -q "moto[server]" boto3 "duckdb==${{ matrix.duckdb }}"
          (moto_server -H 127.0.0.1 -p 5555 >/dev/null 2>&1 &) && sleep 3
          python -c "import boto3;boto3.client('s3',endpoint_url='http://127.0.0.1:5555',region_name='us-east-1').create_bucket(Bucket='geo-test')"
          python tests/test_s3.py build/linux_amd64/geosquare_v2.duckdb_extension

  wasm:
    name: Build for DuckDB-Wasm and test in Chromium
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94.0
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-emscripten

      - name: Set up Emscripten 6.0.9
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.9

      - name: Set up Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build native and wasm extensions
        working-directory: bindings/duckdb
        run: |
          ./build.sh
          ./build_wasm.sh

      - name: Browser test
        working-directory: bindings/duckdb
        run: |
          python -m pip install duckdb==2.0.0
          (cd tests/wasm && npm install --silent && npx playwright-core install chromium)
          tests/wasm/run.sh
