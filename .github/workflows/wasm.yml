name: WebAssembly binding

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wasm:
    name: WebAssembly binding (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.94.0 with the wasm target
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/wasm

      - name: Install wasm-bindgen CLI matching the crate pin
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check Rust formatting and clippy
        working-directory: bindings/wasm
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Build the package
        working-directory: bindings/wasm
        run: npm run build

      - name: Install test dependencies (deck.gl devDependencies)
        working-directory: bindings/wasm
        run: npm install --no-audit --no-fund

      - name: Run tests against spec 2.0 vectors
        working-directory: bindings/wasm
        run: npm test

      - name: Check npm package stays under 200 KB
        working-directory: bindings/wasm
        run: |
          SIZE=$(npm pack --dry-run --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)[0].size))")
          echo "npm package size: ${SIZE} bytes"
          test "${SIZE}" -lt 200000
