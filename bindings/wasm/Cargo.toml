[package]
name = "geosquare-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WebAssembly binding for the GeoSquare V2 grid core (spec 2.0)."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
geosquare-core = { path = "../../core" }
js-sys = "0.3"
# Pinned to the wasm-bindgen-cli version used in CI. The two must match exactly.
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
