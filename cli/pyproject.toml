[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosquare-gsq"
version = "0.1.0"
description = "Command-line tools for the GeoSquare DuckDB engine"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.4,<2.1"]

[project.scripts]
gsq = "gsq_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
